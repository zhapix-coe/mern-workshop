<html>
  <head>
    <title>Intern Management System</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
      }

      .intern-form-section {
        border: solid 0.5px;

        padding: 20px;
        border-radius: 10px;
      }

      input {
        width: 100%;
        margin-bottom: 15px;
        border: solid 0.5px;
        height: 30px;
        border-radius: 5px;
      }

      input[type="radio"] {
        width: 30px;
        height: 15px;
      }

      .btn-panel {
        display: flex;
        flex-direction: row-reverse;
      }
      .btn-panel button {
        height: 30px;
        width: 75px;
        border-radius: 5px;
        border: solid 0.05px;
        margin-left: 5px;
      }
      .btn-panel button:first-child {
        background-color: #ddd;
      }
      .btn-panel button:last-child {
        background-color: rgba(0, 0, 255, 0.305);
      }

      .intern-table-section {
        border: solid 0.5px;
        padding: 10px;
        margin-top: 20px;
        border-radius: 10px;
      }

      table {
        border: solid;
        width: 100%;
      }

      th,
      td {
        border: solid 1px;
        padding: 5px;
        font-size: 12px;
      }

      .footer-section {
        margin: 20px;
      }

      .footer-note {
        display: flex;
        justify-content: center;
        margin: 50px;
      }
    </style>
  </head>

  <body>
    <main>
      <header>
        <h1>Intern Management System</h1>
      </header>

      <section class="intern-form-section">
        <h3>Intern Form</h3>
        <form id="internForm">
          <label> Name: <input type="text" id="internName" required /> </label>
          <label>
            Email: <input type="email" id="internEmail" required />
          </label>
          <label>
            Phone: <input type="number" id="internPhone" required />
          </label>

          <label>Status:</label>

          <div class="radio-group">
            <label
              ><input name="internStatus" type="radio" value="Active" /> Active
            </label>
            <label
              ><input name="internStatus" type="radio" value="InActive" />
              InActive
            </label>
          </div>
          <div class="btn-panel">
            <button>Cancel</button>
            <button type="submit">Save</button>
          </div>
        </form>
      </section>

      <section class="intern-table-section">
        <h3>Intern List</h3>
        <table id="internTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <footer class="footer-section">
        <span class="footer-note">
          Copyright Reserved - Intern Management System
        </span>
      </footer>
    </main>
    <script>
      const internForm = document.getElementById("internForm");
      const internTableBody = document
        .getElementById("internTable")
        .querySelector("tbody");

      let interns = [];

      internForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const name = document.getElementById("internName").value;
        const email = document.getElementById("internEmail").value;
        const phone = document.getElementById("internPhone").value;
        const status = document.querySelector(
          'input[name="internStatus"]:checked'
        ).value;

        const intern = { id: Date.now(), name, email, phone, status };
        interns.push(intern);
        document.getElementById("internForm").reset();

        renderInterns();
      });

      function renderInterns() {
        internTableBody.innerHTML = "";

        interns.forEach((intern) => {
          const row = document.createElement("tr");

          row.innerHTML = `
                          <td>${intern.name}</td>
                          <td>${intern.email}</td>
                          <td>${intern.phone}</td>
                          <td>${intern.status}</td>
                          <td>
                              <button class="edit" onclick="editIntern(${intern.id})">Edit</button>
                              <button class="delete" onclick="deleteIntern(${intern.id})">Delete</button>
                          </td>
                      `;
          internTableBody.appendChild(row);
        });
      }

      function editIntern(id) {
        const intern = interns.find((s) => s.id === id);
        if (intern) {
          document.getElementById("internName").value = intern.name;
          document.getElementById("internEmail").value = intern.email;
          document.getElementById("internPhone").value = intern.phone;
          const radios = document.getElementsByName("internStatus");
          for (let radio of radios) {
            if (radio.value === intern.status) {
              radio.checked = true;
              break;
            }
          }

          deleteIntern(id);
        }
      }

      function deleteIntern(id) {
        interns = interns.filter((intern) => intern.id !== id);
        renderInterns();
      }
      // Initial render
      renderInterns();
    </script>
  </body>
</html>
