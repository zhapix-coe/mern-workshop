<!DOCTYPE html>
<html>
<head>
  <title>Intern Management System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f9;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    .form-box, .list-box {
      background-color: white;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: calc(100% - 10px);
      padding: 8px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      padding: 8px 16px;
      margin-right: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    #activeBtn, #inactiveBtn {
      background-color: #e0e0e0;
      color: black;
    }

    #activeBtn:hover {
      background-color: #a5d6a7;
    }

    #inactiveBtn:hover {
      background-color: #ef9a9a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f0f0f0;
    }

    tr:hover {
      background-color: #f9f9f9;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .action-buttons button {
      flex: 1;
      padding: 6px;
      font-size: 14px;
      white-space: nowrap;
    }

    .action-buttons button:first-child {
      background-color: #4caf50;
    }

    .action-buttons button:first-child:hover {
      background-color: #388e3c;
    }

    .action-buttons button:last-child {
      background-color: #f44336;
    }

    .action-buttons button:last-child:hover {
      background-color: #c62828;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Intern Management System</h2>

    <!-- Intern Form -->
    <div class="form-box">
      <h4>Intern Form</h4>
      <input type="text" id="name" placeholder="Name"><br>
      <input type="email" id="email" placeholder="Email"><br>
      <input type="tel" id="phone" placeholder="Phone"><br>

      <div style="margin-top: 10px;">
        <button id="activeBtn" onclick="setStatus('Active')">Active</button>
        <button id="inactiveBtn" onclick="setStatus('Inactive')">Inactive</button>
      </div>
      <input type="hidden" id="status">

      <br><br>
      <button onclick="saveIntern()">Save</button>
      <button onclick="clearForm()">Cancel</button>
    </div>

    <!-- Intern List -->
    <div class="list-box">
      <h4>Intern List</h4>
      <table id="internTable">
        <thead>
          <tr>
            <th width="15%">Name</th>
            <th>Email</th>
            <th width="20%">Phone</th>
            <th width="15%">Status</th>
            <th width="20%">Action</th>
          </tr>
        </thead>
        <tbody>
          <!-- Intern rows will appear here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let editRow = null;

    function setStatus(value) {
      document.getElementById('status').value = value;

      document.getElementById('activeBtn').style.backgroundColor = '#e0e0e0';
      document.getElementById('inactiveBtn').style.backgroundColor = '#e0e0e0';

      if (value === 'Active') {
        document.getElementById('activeBtn').style.backgroundColor = 'lightgreen';
      } else {
        document.getElementById('inactiveBtn').style.backgroundColor = 'lightcoral';
      }
    }

    function saveIntern() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const status = document.getElementById('status').value;

      if (!name || !email || !phone || !status) {
        alert("Please fill in all fields and select a status.");
        return;
      }

      const table = document.getElementById("internTable").getElementsByTagName("tbody")[0];

      if (editRow === null) {
        const newRow = table.insertRow();
        newRow.insertCell(0).innerText = name;
        newRow.insertCell(1).innerText = email;
        newRow.insertCell(2).innerText = phone;
        newRow.insertCell(3).innerText = status;
        newRow.insertCell(4).innerHTML =
          '<div class="action-buttons">' +
          '<button onclick="editIntern(this)">Edit</button>' +
          '<button onclick="deleteIntern(this)">Delete</button>' +
          '</div>';
      } else {
        editRow.cells[0].innerText = name;
        editRow.cells[1].innerText = email;
        editRow.cells[2].innerText = phone;
        editRow.cells[3].innerText = status;
        editRow = null;
      }

      clearForm();
    }

    function clearForm() {
      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('status').value = '';
      editRow = null;

      document.getElementById('activeBtn').style.backgroundColor = '#e0e0e0';
      document.getElementById('inactiveBtn').style.backgroundColor = '#e0e0e0';
    }

    function editIntern(button) {
      editRow = button.closest('tr');
      document.getElementById('name').value = editRow.cells[0].innerText;
      document.getElementById('email').value = editRow.cells[1].innerText;
      document.getElementById('phone').value = editRow.cells[2].innerText;
      document.getElementById('status').value = editRow.cells[3].innerText;

      setStatus(editRow.cells[3].innerText);
    }

    function deleteIntern(button) {
      if (confirm("Are you sure you want to delete this intern?")) {
        const row = button.closest('tr');
        row.remove();
        clearForm();
      }
    }
  </script>

</body>
</html>
