<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Design Example</title>
  <style>
    :root {
      font-size: 16px; /* 1rem = 16px */
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 1rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }

    .flex-container {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .flex-item {
      background-color: lightblue;
      padding: 1em;
      flex: 1 1 200px;
      text-align: center;
      border: 2px solid #333;
      font-size: 1rem;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    .grid-item {
      background-color: lightcoral;
      padding: 1em;
      text-align: center;
      border: 2px solid #333;
      font-size: 1rem;
    }

    /* Responsive Image */
    .responsive-image {
      width: 50%;
      max-width: 600px;
      height: auto;
      display: block;
      margin: 2rem auto;
    }

    /* Media Query for smaller screens */
    @media (max-width: 600px) {
      body {
        background-color: #c7c16e;
      }

      h1 {
        font-size: 1.5rem;
      }

      .flex-item, .grid-item {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <h1>Responsive Layout with Flex, Grid, %, em, rem, and Media Query</h1>

  <img class="responsive-image" src="https://picsum.photos/600/300" alt="Responsive Image">

  <h2>Flexbox Example</h2>
  <div class="flex-container">
    <div class="flex-item">Flex Item 1</div>
    <div class="flex-item">Flex Item 2</div>
    <div class="flex-item">Flex Item 3</div>
  </div>

  <h2>Grid Example</h2>
  <div class="grid-container">
    <div class="grid-item">Grid 1</div>
    <div class="grid-item">Grid 2</div>
    <div class="grid-item">Grid 3</div>
    <div class="grid-item">Grid 4</div>
  </div>

</body>
</html>
