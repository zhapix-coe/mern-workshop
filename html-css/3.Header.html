<head>
  <!-- Character Encoding -->
  <meta charset="UTF-8">

  <!-- Responsive Design for Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO: Page Description -->
  <meta name="description" content="Learn advanced HTML and CSS techniques for building professional, responsive websites.">

  <!-- SEO: Author Information -->
  <meta name="author" content="Your Name">

  <!-- Browser Compatibility -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Page Title (shown in browser tab and search results) -->
  <title>Advanced HTML & CSS Session</title>

  <!-- Favicon (Browser Tab Icon) -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Link to External CSS File -->
  <link rel="stylesheet" href="styles.css">

  <!-- Preconnect for Performance (Optional) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Example of Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <!-- Open Graph Tags for Social Media Sharing (Optional) -->
  <meta property="og:title" content="Advanced HTML & CSS Workshop">
  <meta property="og:description" content="Master the building blocks of modern, responsive web design.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://example.com/preview.png">

  <!-- Link to External JavaScript File (defer recommended) -->
  <script src="script.js" defer></script>
</head>
