<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ComponentsDemo</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
      header {
        background-color: green;
        width: 90%;
        height: 50px;
        color: white;
        display: flex;
        justify-content: center;
      }
      main {
        background-color: blueviolet;
        display: flex;
        width: 90%;
        justify-content: center;
      }

      .form-section,
      .table-section {
        width: 40%;
        margin: 10px;
        border: solid;
        border-radius: 10px;
        background-color: orange;
        padding: 10px;
        
        height: 250px;
      }
      button {
        display: block;

        margin: auto;        
        margin-top: 10px;
        
      }
      input {
        width: 90%;
      }
      tr,
      td,
      th {
        border: solid 1px;
        padding: 10px;
      }
      table{
        background-color: rgb(23, 208, 137);
      }
      form {
        background-color: blue;
        height: 150px;
        padding: 10px;
        color:white
      }
      footer {
        display: flex;
        justify-content: center;
        padding-top: 10px;
        padding-bottom: 10px;
        width: 90%;
        background-color: deepskyblue;
      }
      label{
        display: block;
        margin-top: 10px;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <header>
      <h2>Header Section</h2>
    </header>
    <main>
      <section class="form-section">
        <h3>Form Section</h3>
        <button onclick="alert('hello world')">Test Button</button>
        <form>
          <label for="name">Name </label><input id="name" type="text" />
          <label forl="age">Age: </label> <input id="age" type="number" />
          <button type="submit">Submit</button>
        </form>
      </section>
      <section class="table-section">
        <h3>Table Section</h3>
        <table cellspacing="0">
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>SenthilKumar</td>
              <td>20</td>
            </tr>
            <tr>
              <td>Karthikeyan</td>
              <td>30</td>
            </tr>   
          </tbody>
        </table>
      </section>
    </main>

    <footer><span> &copy; Zhapix Center of Excellence</span></footer>
  </body>
</html>
