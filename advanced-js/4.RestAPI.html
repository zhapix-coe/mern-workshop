<!DOCTYPE html>
<html>
<head>
  <title>REST API Demo - AJAX, fetch, axios</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body{
      background-color: antiquewhite;
    }
    pre {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      max-height: 200px;
      overflow: auto;
    }
  </style>
</head>
<body>

  <h2>REST API Demo (Users)</h2>

  <h3>1. AJAX (`XMLHttpRequest`)</h3>
  <pre id="ajaxResult">Loading...</pre>

  <h3>2. fetch()</h3>
  <pre id="fetchResult">Loading...</pre>

  <h3>3. axios</h3>
  <pre id="axiosResult">Loading...</pre>

  <script>
    // AJAX (XMLHttpRequest)
    const xhr = new XMLHttpRequest();
    xhr.open("GET", "https://jsonplaceholder.typicode.com/users");
    xhr.onload = () => {
      document.getElementById("ajaxResult").textContent = xhr.status === 200
        ? JSON.stringify(JSON.parse(xhr.responseText), null, 2)
        : "AJAX request failed.";
    };
    xhr.send();

    // fetch()
    fetch("https://jsonplaceholder.typicode.com/users")
      .then(res => res.json())
      .then(data => {
        document.getElementById("fetchResult").textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById("fetchResult").textContent = "Fetch Error: " + err.message;
      });

    // axios
    axios.get("https://jsonplaceholder.typicode.com/users")
      .then(res => {
        document.getElementById("axiosResult").textContent = JSON.stringify(res.data, null, 2);
      })
      .catch(err => {
        document.getElementById("axiosResult").textContent = "Axios Error: " + err.message;
      });
  </script>

</body>
</html>
