<html>
  <head>
    <title>Intern Management System</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
      }

      .intern-form-section {
        border: solid 0.5px;

        padding: 20px;
        border-radius: 10px;
      }

      input {
        width: 100%;
        margin-bottom: 15px;
        border: solid 0.5px;
        height: 30px;
        border-radius: 5px;
      }

      input[type='radio'] {
        width: 30px;
        height: 15px;
      }

      .btn-panel {
        display: flex;
        flex-direction: row-reverse;
      }
      .btn-panel button {
        height: 30px;
        width: 75px;
        border-radius: 5px;
        border: solid 0.05px;
        margin-left: 5px;
      }
      .btn-panel button:first-child {
        background-color: #ddd;
      }
      .btn-panel button:last-child {
        background-color: rgba(0, 0, 255, 0.305);
      }

      .intern-table-section {
        border: solid .5px;
        padding: 10px;
        margin-top: 20px;
        border-radius: 10px;
      }

      table{

        border: solid;
        width: 100%;

      }

      th,td {
        border:solid 1px;
        padding: 5px;
        font-size: 12px;

      }

      .footer-section{                
        margin: 20px;

      }

      .footer-note{

        display: flex;
        justify-content: center;
        margin: 50px;
      }

    </style>
  </head>

  <body>
    <main>
      <header>
        <h1>Intern Management System</h1>
      </header>

      <section class="intern-form-section">
        <h3>Intern Form</h3>
        <form>
          <label> Name: <input type="text" required /> </label>
          <label> Email: <input type="email" required /> </label>
          <label> Phone: <input type="number" required /> </label>

          <label>Status:</label>
          <div class="radio-group">
            <label><input name="status" type="radio" /> Active </label>
            <label><input name="status" type="radio" /> InActive </label>
          </div>
          <div class="btn-panel">
            <button>Cancel</button>
            <button>Save</button>
          </div>
        </form>
      </section>

      <section class="intern-table-section">
        <h3>Intern List</h3>
        <table>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Status</th>
          </tr>

          <tr>
            <td>Rudramoorthy</td>
            <td>rudra@gmail.com</td>
            <td>8098844454</td>
            <td>Active</td>
          </tr>
        </table>
      </section>

      <footer class="footer-section">
        <span class="footer-note"> Copyright Reserved - Intern Management System </span>
      </footer>
    </main>
  </body>
</html>
